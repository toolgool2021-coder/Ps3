<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TL: PS3 Web Game</title>
<style>
html,body{margin:0;padding:0;background:#080a0f;color:#fff;font-family:Arial,Helvetica,sans-serif;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#wrap{width:960px;max-width:100%;height:540px;max-height:100%;position:relative;background:#10141c;overflow:hidden;border:2px solid #252d3b;box-sizing:border-box}
canvas{display:block;width:100%;height:100%;background:#0c1016}
#menu,#pause,#gameover{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(5,7,11,.92);z-index:5}
.panel{width:520px;max-width:86%;box-sizing:border-box;padding:30px;border:1px solid #394354;background:#121722;box-shadow:0 0 35px rgba(0,0,0,.6)}
h1{margin:0 0 8px;font-size:38px;letter-spacing:4px}
h2{margin:0 0 18px;font-size:25px}
p{color:#aeb7c7;line-height:1.5}
button{display:block;width:100%;margin:10px 0;padding:14px;border:1px solid #465267;background:#1a2230;color:#fff;font-size:18px;cursor:pointer}
button:hover{background:#253043}
.small{font-size:13px;color:#778296}
.hidden{display:none!important}
#hud{position:absolute;left:12px;top:10px;z-index:2;font-size:16px;text-shadow:2px 2px 2px #000;line-height:1.6}
#hint{position:absolute;right:12px;top:10px;z-index:2;color:#aeb7c7;font-size:13px;text-shadow:2px 2px 2px #000}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="960" height="540"></canvas>

<div id="hud" class="hidden">
  HP: <span id="hp">3</span> &nbsp; SCORE: <span id="score">0</span> &nbsp; COINS: <span id="coins">0</span>
</div>
<div id="hint" class="hidden">ARROWS / WASD = MOVE &nbsp; P = PAUSE</div>

<div id="menu">
  <div class="panel">
    <h1>TL</h1>
    <h2>PS3 WEB GAME</h2>
    <p>Собери монеты, избегай красных врагов и набери как можно больше очков.</p>
    <button id="start">START GAME</button>
    <button id="controls">CONTROLS</button>
    <p class="small">Работает одним HTML-файлом. Оптимизировано под старые браузеры.</p>
  </div>
</div>

<div id="pause" class="hidden">
  <div class="panel">
    <h2>PAUSED</h2>
    <button id="resume">RESUME</button>
    <button id="quitPause">MAIN MENU</button>
  </div>
</div>

<div id="gameover" class="hidden">
  <div class="panel">
    <h2>GAME OVER</h2>
    <p>Счёт: <b id="finalScore">0</b><br>Монеты: <b id="finalCoins">0</b></p>
    <button id="again">PLAY AGAIN</button>
    <button id="quitOver">MAIN MENU</button>
  </div>
</div>
</div>

<script>
(function(){
"use strict";

var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");
var W=960,H=540;

var keys={};
var state="menu";
var last=0;
var score=0,coins=0,hp=3;
var spawnTimer=0,coinTimer=0;
var enemies=[],items=[];
var player={x:W/2,y:H/2,w:28,h:28,speed:250,inv:0};

function el(id){return document.getElementById(id);}
function show(id){el(id).className="";}
function hide(id){el(id).className="hidden";}

document.onkeydown=function(e){
  var k=e.keyCode||e.which;
  keys[k]=true;
  if(k===80){
    if(state==="play"){state="pause";show("pause");}
    else if(state==="pause"){state="play";hide("pause");}
  }
  if(k===13 && state==="menu") startGame();
  if(k===27 && state==="pause"){state="play";hide("pause");}
};
document.onkeyup=function(e){keys[e.keyCode||e.which]=false;};

el("start").onclick=startGame;
el("again").onclick=startGame;
el("resume").onclick=function(){state="play";hide("pause");};
el("quitPause").onclick=mainMenu;
el("quitOver").onclick=mainMenu;
el("controls").onclick=function(){
  alert("Управление:\n\nСтрелки или WASD — движение\nP — пауза\nENTER — старт\nESC — снять паузу");
};

function startGame(){
  score=0;coins=0;hp=3;
  enemies=[];items=[];
  player.x=W/2;player.y=H/2;player.inv=0;
  spawnTimer=.8;coinTimer=.4;
  state="play";
  hide("menu");hide("pause");hide("gameover");
  show("hud");show("hint");
  updateHud();
}

function mainMenu(){
  state="menu";
  hide("pause");hide("gameover");hide("hud");hide("hint");show("menu");
}

function updateHud(){
  el("hp").innerHTML=hp;
  el("score").innerHTML=Math.floor(score);
  el("coins").innerHTML=coins;
}

function distance(a,b){
  var dx=a.x-b.x,dy=a.y-b.y;
  return Math.sqrt(dx*dx+dy*dy);
}

function spawnEnemy(){
  var side=Math.floor(Math.random()*4),x,y;
  if(side===0){x=-25;y=Math.random()*H;}
  if(side===1){x=W+25;y=Math.random()*H;}
  if(side===2){x=Math.random()*W;y=-25;}
  if(side===3){x=Math.random()*W;y=H+25;}
  enemies.push({
    x:x,y:y,w:24,h:24,
    speed:65+Math.random()*55+Math.min(score/50,80)
  });
}

function spawnCoin(){
  items.push({
    x:35+Math.random()*(W-70),
    y:55+Math.random()*(H-90),
    r:8
  });
}

function update(dt){
  if(state!=="play") return;

  var dx=0,dy=0;
  if(keys[37]||keys[65])dx--;
  if(keys[39]||keys[68])dx++;
  if(keys[38]||keys[87])dy--;
  if(keys[40]||keys[83])dy++;

  if(dx!==0||dy!==0){
    var len=Math.sqrt(dx*dx+dy*dy);
    dx/=len;dy/=len;
  }

  player.x+=dx*player.speed*dt;
  player.y+=dy*player.speed*dt;
  if(player.x<15)player.x=15;
  if(player.x>W-15)player.x=W-15;
  if(player.y<45)player.y=45;
  if(player.y>H-15)player.y=H-15;

  if(player.inv>0)player.inv-=dt;

  spawnTimer-=dt;
  coinTimer-=dt;
  if(spawnTimer<=0){
    spawnEnemy();
    spawnTimer=Math.max(.35,1.25-score/1000);
  }
  if(coinTimer<=0){
    spawnCoin();
    coinTimer=.7+Math.random()*1.2;
  }

  var i,e,d;
  for(i=enemies.length-1;i>=0;i--){
    e=enemies[i];
    d=distance(e,player);
    if(d>0){
      e.x+=(player.x-e.x)/d*e.speed*dt;
      e.y+=(player.y-e.y)/d*e.speed*dt;
    }
    if(d<25 && player.inv<=0){
      hp--;
      player.inv=1.2;
      enemies.splice(i,1);
      if(hp<=0){gameOver();return;}
    }
  }

  for(i=items.length-1;i>=0;i--){
    if(distance(items[i],player)<22){
      coins++;
      score+=100;
      items.splice(i,1);
    }
  }

  score+=dt*10;
  updateHud();
}

function gameOver(){
  state="gameover";
  el("finalScore").innerHTML=Math.floor(score);
  el("finalCoins").innerHTML=coins;
  hide("hud");hide("hint");show("gameover");
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // background
  ctx.fillStyle="#0c1016";
  ctx.fillRect(0,0,W,H);

  // simple grid
  ctx.strokeStyle="#171e29";
  ctx.lineWidth=1;
  var x,y;
  for(x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,40);ctx.lineTo(x,H);ctx.stroke();}
  for(y=40;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // border
  ctx.strokeStyle="#303a4b";
  ctx.strokeRect(1,40,W-2,H-41);

  // coins
  var i,it,e;
  for(i=0;i<items.length;i++){
    it=items[i];
    ctx.beginPath();
    ctx.arc(it.x,it.y,it.r,0,Math.PI*2);
    ctx.fillStyle="#d7b84a";
    ctx.fill();
    ctx.strokeStyle="#fff0a0";
    ctx.stroke();
  }

  // enemies
  for(i=0;i<enemies.length;i++){
    e=enemies[i];
    ctx.fillStyle="#b53b48";
    ctx.fillRect(e.x-12,e.y-12,24,24);
    ctx.fillStyle="#ff6975";
    ctx.fillRect(e.x-5,e.y-5,5,5);
    ctx.fillRect(e.x+4,e.y-5,5,5);
  }

  // player blink while invulnerable
  if(player.inv<=0 || Math.floor(player.inv*10)%2===0){
    ctx.fillStyle="#6d91d9";
    ctx.fillRect(player.x-14,player.y-14,28,28);
    ctx.fillStyle="#b9d0ff";
    ctx.fillRect(player.x-6,player.y-6,5,5);
    ctx.fillRect(player.x+2,player.y-6,5,5);
  }

  // title strip
  ctx.fillStyle="#10151e";
  ctx.fillRect(0,0,W,40);
  ctx.fillStyle="#e5e9f0";
  ctx.font="bold 16px Arial";
  ctx.fillText("TL // PS3 WEB GAME",15,26);
  ctx.fillStyle="#69758a";
  ctx.font="13px Arial";
  ctx.fillText("SURVIVE",W-70,25);
}

function loop(t){
  if(!last)last=t;
  var dt=(t-last)/1000;
  if(dt>.05)dt=.05;
  last=t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
})();
</script>
</body>
</html>
